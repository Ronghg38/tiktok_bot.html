<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Soi Cầu Xổ Số Miền Nam</title>
    <!-- Tailwind CSS CDN cho giao diện đẹp, chuẩn mobile -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-4">
    <div class="max-w-2xl mx-auto bg-white shadow-lg rounded-2xl p-6 mt-4">
        <h1 class="text-2xl font-bold text-center text-indigo-600 mb-2">🎯 Soi Cầu XSMN Tự Động</h1>
        <p class="text-sm text-center text-slate-500 mb-6">Thuật toán ghép vị trí tìm biên độ cầu chạy liên tục</p>

        <!-- Nút điều khiển -->
        <div class="flex gap-3 mb-6">
            <button onclick="chaySoiCau()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl shadow transition duration-200">
                🚀 Chạy Soi Cầu Ngay
            </button>
        </div>

        <!-- Khu vực hiển thị kết quả -->
        <div id="loading" class="hidden text-center py-4 text-slate-500 animate-pulse">Đang phân tích dữ liệu các kỳ quay...</div>
        
        <div id="result-container" class="space-y-3">
            <!-- Kết quả sẽ hiện ở đây -->
        </div>
    </div>

    <script>
        // Mẫu dữ liệu kết quả các kỳ quay gần nhất (Giải 8 đến Giải ĐB)
        const sampleData = [
            { date: "2026-10-25", numbers: ["42", "153", "8492", "1029", "58392", "49102", "85923", "19402", "759203"] },
            { date: "2026-10-26", numbers: ["92", "840", "1932", "5830", "92830", "48201", "01938", "58392", "849201"] },
            { date: "2026-10-27", numbers: ["01", "948", "2019", "4820", "10398", "58392", "29103", "84920", "938201"] },
            { date: "2026-10-28", numbers: ["83", "201", "5839", "1039", "84920", "19382", "58390", "29104", "103928"] }
        ];

        function flattenPositions(numbersList) {
            let flatDigits = [];
            numbersList.forEach(num => {
                String(num).split('').forEach(char => {
                    flatDigits.push(parseInt(char));
                });
            });
            return flatDigits;
        }

        function chaySoiCau() {
            const loading = document.getElementById('loading');
            const container = document.getElementById('result-container');
            
            loading.classList.remove('hidden');
            container.innerHTML = '';

            setTimeout(() => {
                loading.classList.add('hidden');
                
                let processedDays = sampleData.map(day => flattenPositions(day.numbers));
                let numDays = processedDays.length;
                let totalPositions = processedDays[0].length;
                let cauDep = [];

                // Thuật toán quét cặp vị trí
                for (let i = 0; i < totalPositions; i++) {
                    for (let j = i + 1; j < totalPositions; j++) {
                        let bienDo = 0;
                        for (let dayIdx = 0; dayIdx < numDays - 1; dayIdx++) {
                            let d1 = processedDays[dayIdx][i];
                            let d2 = processedDays[dayIdx][j];
                            let loChuan = `${d1}${d2}`;
                            let loLon = `${d2}${d1}`;
                            
                            let nextDayStr = processedDays[dayIdx + 1].join('');
                            
                            if (nextDayStr.includes(loChuan) || nextDayStr.includes(loLon)) {
                                bienDo++;
                            } else {
                                break;
                            }
                        }

                        if (bienDo >= 2) { // Lọc biên độ >= 2
                            let lastD1 = processedDays[processedDays.length - 1][i];
                            let lastD2 = processedDays[processedDays.length - 1][j];
                            
                            cauDep.push({
                                viTri: `Vị trí [${i}] & [${j}]`,
                                bienDo: bienDo,
                                duDoan: `${lastD1}${lastD2} (Lộn: ${lastD2}${lastD1})`
                            });
                        }
                    }
                }

                // Sắp xếp theo biên độ giảm dần
                cauDep.sort((a, b) => b.bienDo - a.bienDo);

                if (cauDep.length > 0) {
                    let html = `<h2 class="font-semibold text-slate-700 mb-2">🔥 Top Đường Cầu Đẹp Nhất:</h2>`;
                    cauDep.slice(0, 5).forEach((item, index) => {
                        html += `
                            <div class="bg-slate-50 border border-slate-200 p-4 rounded-xl flex justify-between items-center">
                                <div>
                                    <span class="inline-block bg-indigo-100 text-indigo-700 text-xs font-bold px-2 py-1 rounded-md mb-1">${item.viTri}</span>
                                    <p class="text-lg font-bold text-slate-800">Cặp số: <span class="text-rose-600">${item.duDoan}</span></p>
                                </div>
                                <div class="text-right">
                                    <span class="text-xs text-slate-500 block">Biên độ</span>
                                    <span class="text-lg font-extrabold text-emerald-600">${item.bienDo} ngày</span>
                                </div>
                            </div>
                        `;
                    });
                    container.innerHTML = html;
                } else {
                    container.innerHTML = `<p class="text-center text-amber-600">Không tìm thấy đường cầu phù hợp trong dữ liệu mẫu.</p>`;
                }
            }, 400);
        }
    </script>
</body>
</html>
