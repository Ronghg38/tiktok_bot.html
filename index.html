<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Chốt Số & Soi Cầu XSMN Theo Ngày</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-3">
    <div class="max-w-xl mx-auto bg-white shadow-lg rounded-2xl p-5 mt-2">
        <h1 class="text-xl font-bold text-center text-indigo-600 mb-1">🎯 Chốt Số & Soi Cầu XSMN Theo Ngày</h1>
        <p class="text-xs text-center text-slate-500 mb-4">Lọc BTL, Xiên 2, và Lô 3 Số theo lịch quay các đài trong ngày</p>

        <!-- Chọn ngày quay -->
        <div class="mb-4">
            <label class="block text-xs font-semibold text-slate-700 mb-1">Chọn Ngày Soi Cầu:</label>
            <input type="date" id="dateSelect" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500" value="2026-10-28">
        </div>

        <!-- Hiển thị các đài trong ngày -->
        <div class="mb-4 bg-indigo-50 border border-indigo-100 rounded-xl p-3">
            <span class="text-xs font-bold text-indigo-700 block mb-1">🏛️ Các đài quay trong ngày:</span>
            <div id="daiList" class="flex flex-wrap gap-1.5">
                <!-- Danh sách đài sẽ load tự động theo ngày -->
            </div>
        </div>

        <!-- Nút thực hiện -->
        <div class="mb-5">
            <button onclick="chayPhanTichTheoNgay()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl shadow transition duration-200 text-sm">
                🚀 Phân Tích & Chốt Số (BTL, Xiên, 3 Càng)
            </button>
        </div>

        <!-- Khu vực hiển thị kết quả chốt số -->
        <div id="loading" class="hidden text-center py-4 text-slate-500 text-sm animate-pulse">Đang tổng hợp dữ liệu các đài trong ngày...</div>
        
        <div id="result-container" class="space-y-4">
            <p class="text-center text-slate-400 text-xs">Vui lòng chọn ngày và nhấn nút phân tích để xem bảng chốt số.</p>
        </div>
    </div>

    <script>
        // Lịch quay XSMN mẫu theo thứ trong tuần và cơ sở dữ liệu các đài
        const databaseMienNam = {
            "hcm": { name: "TP. Hồ Chí Minh", data: ["42", "153", "8492", "1029", "58392", "49102", "85923", "19402", "759203"] },
            "longan": { name: "Long An", data: ["15", "928", "3829", "4920", "10392", "58392", "29103", "84920", "482019"] },
            "binhduong": { name: "Bình Dương", data: ["67", "301", "8492", "1938", "58392", "10392", "84920", "29104", "938201"] },
            "vungtau": { name: "Vũng Tàu", data: ["49", "583", "1039", "5830", "29103", "84920", "19382", "58390", "103928"] },
            "cantho": { name: "Cần Thơ", data: ["33", "501", "9283", "4820", "10392", "58392", "29103", "84920", "193820"] },
            "dongnai": { name: "Đồng Nai", data: ["88", "129", "5839", "1039", "84920", "19382", "58390", "29104", "482019"] }
        };

        // Gán các đài theo ngày trong tuần (Thứ 2 đến Chủ Nhật)
        function getDaisByDate(dateStr) {
            let dateObj = new Date(dateStr);
            let dayOfWeek = dateObj.getDay(); // 0: CN, 1: T2, ..., 6: T7
            
            // Phân bổ đài XSMN theo lịch thực tế
            switch(dayOfWeek) {
                :
                case 1: // Thứ 2: TP.HCM, Đồng Nai, Cà Mau
                    return ["hcm", "dongnai"];
                case 2: // Thứ 3: Bến Tre, Vũng Tàu, Bạc Liêu
                    return ["vungtau"];
                case 3: // Thứ 4: Đồng Nai, Cần Thơ, Sóc Trăng
                    return ["dongnai", "cantho"];
                case 4: // Thứ 5: Tây Ninh, An Giang, Bình Thuận
                    return ["binhduong", "longan"];
                case 5: // Thứ 6: Vĩnh Long, Bình Dương, Trà Vinh
                    return ["binhduong", "vungtau"];
                case 6: // Thứ 7: TP.HCM, Long An, Bình Phước, Hậu Giang
                    return ["hcm", "longan"];
                case 0: // Chủ Nhật: Tiền Giang, Kiên Giang, Đà Lạt
                    return ["cantho", "hcm"];
                default:
                    return ["hcm", "cantho", "dongnai"];
            }
        }

        // Cập nhật hiển thị danh sách đài khi thay đổi ngày
        document.getElementById('dateSelect').addEventListener('change', function() {
            updateDaiUI(this.value);
        });

        function updateDaiUI(dateStr) {
            let dais = getDaisByDate(dateStr);
            let container = document.getElementById('daiList');
            container.innerHTML = '';
            dais.forEach(code => {
                if (databaseMienNam[code]) {
                    container.innerHTML += `<span class="bg-white text-indigo-800 border border-indigo-200 text-xs font-semibold px-2.5 py-1 rounded-lg shadow-sm">${databaseMienNam[code].name}</span>`;
                }
            });
        }

        // Khởi tạo chạy lần đầu
        updateDaiUI(document.getElementById('dateSelect').value);

        function flattenPositions(numbersList) {
            let flatDigits = [];
            numbersList.forEach(num => {
                String(num).split('').forEach(char => {
                    flatDigits.push(parseInt(char));
                });
            });
            return flatDigits;
        }

        function chayPhanTichTheoNgay() {
            let selectedDate = document.getElementById('dateSelect').value;
            let dais = getDaisByDate(selectedDate);
            
            let loading = document.getElementById('loading');
            let container = document.getElementById('result-container');
            
            loading.classList.remove('hidden');
            container.innerHTML = '';

            setTimeout(() => {
                loading.classList.add('hidden');
                
                let allChotSoResults = [];

                // Chạy thuật toán cho từng đài trong ngày
                dais.forEach(daiCode => {
                    let daiInfo = databaseMienNam[daiCode];
                    if (!daiInfo) return;

                    // Giả lập lịch sử 3 kỳ gần nhất của đài
                    let mockDays = [
                        flattenPositions(daiInfo.data),
                        flattenPositions(daiInfo.data.map(n => String(parseInt(n)+1))),
                        flattenPositions(daiInfo.data)
                    ];
                    
                    let totalPositions = mockDays[0].length;
                    let daiCaus = [];

                    for (let i = 0; i < totalPositions; i++) {
                        for (let j = i + 1; j < totalPositions; j++) {
                            let d1 = mockDays[2][i];
                            let d2 = mockDays[2][j];
                            let loChuan = `${d1}${d2}`;
                            let loLon = `${d2}${d1}`;
                            
                            // Tạo số 3 càng (Ghép thêm 1 chữ số đầu giải ĐB)
                            let cang3 = `${mockDays[2][0] % 10}${loChuan}`;

                            daiCaus.push({
                                btl: loChuan,
                                lot: loLon,
                                cang3: cang3,
                                viTri: `Vị trí [${i}]-[${j}]`,
                                bienDo: Math.floor(Math.random() * 2) + 3 // Biên độ từ 3-4 ngày
                            });
                        }
                    }

                    // Lấy ra cầu có biên độ cao nhất cho đài này
                    daiCaus.sort((a, b) => b.bienDo - a.bienDo);
                    if (daiCaus.length > 0) {
                        allChotSoResults.push({
                            daiName: daiInfo.name,
                            btl: daiCaus[0].btl,
                            lot: daiCaus[0].lot,
                            cang3: daiCaus[0].cang3,
                            viTri: daiCaus[0].viTri,
                            bienDo: daiCaus[0].bienDo
                        });
                    }
                });

                // Xây dựng giao diện hiển thị kết quả chốt số chi tiết
                let html = `
                    <div class="bg-emerald-50 border border-emerald-200 p-3 rounded-xl text-xs text-emerald-800 mb-3">
                        ✅ Đã tổng hợp và lọc cầu chạy chuẩn cho các đài ngày: <strong class="text-emerald-900">${selectedDate}</strong>
                    </div>
                `;

                // 1. Phần chốt số chi tiết từng đài
                html += `<h2 class="font-bold text-slate-700 text-sm mb-2">📋 Bảng Chốt Số Chi Tiết Từng Đài:</h2>`;
                allChotSoResults.forEach(item => {
                    html += `
                        <div class="bg-slate-50 border border-slate-200 p-3.5 rounded-xl mb-2.5">
                            <div class="flex justify-between items-center mb-1.5">
                                <span class="bg-indigo-600 text-white text-xs font-bold px-2 py-0.5 rounded">${item.daiName}</span>
                                <span class="text-xs text-slate-500">Cầu: ${item.viTri} (Biên độ: <b class="text-emerald-600">${item.bienDo} ngày</b>)</span>
                            </div>
                            <div class="grid grid-cols-3 gap-2 mt-2 text-center">
                                <div class="bg-white p-2 rounded-lg border border-slate-200">
                                    <span class="text-[10px] text-slate-400 block">BẠCH THỦ LÔ</span>
                                    <span class="text-base font-extrabold text-rose-600">${item.btl}</span>
                                </div>
                                <div class="bg-white p-2 rounded-lg border border-slate-200">
                                    <span class="text-[10px] text-slate-400 block">LÔ LỘN / CẶP</span>
                                    <span class="text-base font-extrabold text-indigo-600">${item.lot}</span>
                                </div>
                                <div class="bg-white p-2 rounded-lg border border-slate-200">
                                    <span class="text-[10px] text-slate-400 block">LÔ 3 CÀNG</span>
                                    <span class="text-base font-extrabold text-amber-600">${item.cang3}</span>
                                </div>
                            </div>
                        </div>
                    `;
                });

                // 2. Lọc Xiên 2 ghép từ các đài trong ngày
                if (allChotSoResults.length >= 2) {
                    let xien2_1 = `${allChotSoResults[0].btl} - ${allChotSoResults[1].btl}`;
                    let xien2_2 = allChotSoResults.length >= 3 ? `${allChotSoResults[1].btl} - ${allChotSoResults[2].btl}` : `${allChotSoResults[0].btl} - ${allChotSoResults[0].lot}`;
                    
                    html += `
                        <div class="mt-4 bg-amber-50 border border-amber-200 p-3.5 rounded-xl">
                            <h2 class="font-bold text-amber-800 text-sm mb-2">🔥 Gợi Ý Lọc Cặp Xiên 2 Trong Ngày:</h2>
                            <div class="flex gap-2">
                                <div class="flex-1 bg-white p-2.5 rounded-lg border border-amber-200 text-center">
                                    <span class="text-[10px] text-slate-500 block">XIÊN 2 (CẶP 1)</span>
                                    <span class="text-sm font-bold text-rose-600">${xien2_1}</span>
                                </div>
                                <div class="flex-1 bg-white p-2.5 rounded-lg border border-amber-200 text-center">
                                    <span class="text-[10px] text-slate-500 block">XIÊN 2 (CẶP 2)</span>
                                    <span class="text-sm font-bold text-rose-600">${xien2_2}</span>
                                </div>
                            </div>
                        </div>
                    `;
                }

                container.innerHTML = html;
            }, 300);
        }
    </script>
</body>
</html>
