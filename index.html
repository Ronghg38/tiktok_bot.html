<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chốt Số & Soi Cầu XSMN Theo Ngày</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-3">
    <div class="max-w-xl mx-auto bg-white shadow-lg rounded-2xl p-5 mt-2">
        <h1 class="text-xl font-bold text-center text-indigo-600 mb-1">🎯 Chốt Số & Soi Cầu XSMN Theo Ngày</h1>
        <p class="text-xs text-center text-slate-500 mb-4">Phân tích độc lập BTL, Xiên, 3 Càng cho từng đài trong ngày</p>

        <!-- Chọn ngày quay -->
        <div class="mb-4">
            <label class="block text-xs font-semibold text-slate-700 mb-1">Chọn Ngày Soi Cầu:</label>
            <input type="date" id="dateSelect" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <!-- Hiển thị các đài trong ngày -->
        <div class="mb-4 bg-indigo-50 border border-indigo-100 rounded-xl p-3">
            <span class="text-xs font-bold text-indigo-700 block mb-1">🏛️ Các đài quay trong ngày:</span>
            <div id="daiList" class="flex flex-wrap gap-1.5"></div>
        </div>

        <!-- Nút thực hiện -->
        <div class="mb-5">
            <button onclick="chayPhanTichTheoNgay()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl shadow transition duration-200 text-sm">
                🚀 Phân Tích & Chốt Số (BTL, Xiên, 3 Càng)
            </button>
        </div>

        <!-- Khu vực hiển thị kết quả -->
        <div id="loading" class="hidden text-center py-4 text-slate-500 text-sm animate-pulse">Đang phân tích đường cầu độc lập cho từng đài...</div>
        
        <div id="result-container" class="space-y-4">
            <p class="text-center text-slate-400 text-xs">Vui lòng chọn ngày và nhấn nút phân tích để xem bảng chốt số.</p>
        </div>
    </div>

    <script>
        const todayStr = new Date().toISOString().split('T')[0];
        document.getElementById('dateSelect').value = todayStr;

        const lichQuayMienNam = {
            1: [ {code: "hcm", name: "TP. Hồ Chí Minh"}, {code: "dongnai", name: "Đồng Nai"}, {code: "soctrang", name: "Sóc Trăng"} ],
            2: [ {code: "bentre", name: "Bến Tre"}, {code: "vungtau", name: "Vũng Tàu"}, {code: "baclieu", name: "Bạc Liêu"} ],
            3: [ {code: "dongnai", name: "Đồng Nai"}, {code: "cantho", name: "Cần Thơ"}, {code: "soctrang", name: "Sóc Trăng"} ],
            4: [ {code: "tayninh", name: "Tây Ninh"}, {code: "angiang", name: "An Giang"}, {code: "binhthuan", name: "Bình Thuận"} ],
            5: [ {code: "vinhlong", name: "Vĩnh Long"}, {code: "binhduong", name: "Bình Dương"}, {code: "travinh", name: "Trà Vinh"} ],
            6: [ {code: "hcm", name: "TP. Hồ Chí Minh"}, {code: "longan", name: "Long An"}, {code: "binhphuoc", name: "Bình Phước"}, {code: "haugiang", name: "Hậu Giang"} ],
            0: [ {code: "tiengiang", name: "Tiền Giang"}, {code: "kiengiang", name: "Kiên Giang"}, {code: "dalat", name: "Đà Lạt"} ]
        };

        function updateDaiUI(dateStr) {
            let dateObj = new Date(dateStr);
            let dayOfWeek = dateObj.getDay();
            let dais = lichQuayMienNam[dayOfWeek] || lichQuayMienNam[1];
            
            let container = document.getElementById('daiList');
            container.innerHTML = '';
            dais.forEach(dai => {
                container.innerHTML += `<span class="bg-white text-indigo-800 border border-indigo-200 text-xs font-semibold px-2.5 py-1 rounded-lg shadow-sm">${dai.name}</span>`;
            });
        }

        document.getElementById('dateSelect').addEventListener('change', function() {
            updateDaiUI(this.value);
        });

        updateDaiUI(todayStr);

        function hashCode(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            return Math.abs(hash);
        }

        function chayPhanTichTheoNgay() {
            let selectedDate = document.getElementById('dateSelect').value;
            let dateObj = new Date(selectedDate);
            let dayOfWeek = dateObj.getDay();
            let dais = lichQuayMienNam[dayOfWeek] || lichQuayMienNam[1];
            
            let loading = document.getElementById('loading');
            let container = document.getElementById('result-container');
            
            loading.classList.remove('hidden');
            container.innerHTML = '';

            setTimeout(() => {
                loading.classList.add('hidden');
                
                let allChotSoResults = [];

                // Tạo kết quả độc lập dựa trên mã đài và ngày chọn
                dais.forEach((dai) => {
                    let seed = hashCode(selectedDate + dai.code);
                    
                    // Random số khác nhau cho từng đài
                    let btlNum = (seed % 89) + 10; // Từ 10 đến 98
                    let btlStr = btlNum < 10 ? "0" + btlNum : String(btlNum);
                    
                    // Đảo lô lộn
                    let lotStr = btlStr.split('').reverse().join('');
                    if (btlStr === lotStr) lotStr = String((btlNum + 1) % 90).padStart(2, '0');

                    // 3 càng ngẫu nhiên theo đài
                    let cangNum = (seed % 900) + 100;
                    let bienDoVal = (seed % 3) + 3; // Biên độ từ 3 đến 5 ngày
                    let pos1 = seed % 5;
                    let pos2 = pos1 + 2;

                    allChotSoResults.push({
                        daiName: dai.name,
                        btl: btlStr,
                        lot: lotStr,
                        cang3: String(cangNum),
                        viTri: `Vị trí [${pos1}]-[${pos2}]`,
                        bienDo: bienDoVal
                    });
                });

                let html = `
                    <div class="bg-emerald-50 border border-emerald-200 p-3 rounded-xl text-xs text-emerald-800 mb-3">
                        ✅ Phân tích thành công cầu độc lập cho các đài ngày: <strong class="text-emerald-900">${selectedDate}</strong>
                    </div>
                `;

                html += `<h2 class="font-bold text-slate-700 text-sm mb-2">📋 Bảng Chốt Số Chi Tiết Từng Đài:</h2>`;
                allChotSoResults.forEach(item => {
                    html += `
                        <div class="bg-slate-50 border border-slate-200 p-3.5 rounded-xl mb-2.5">
                            <div class="flex justify-between items-center mb-1.5">
                                <span class="bg-indigo-600 text-white text-xs font-bold px-2 py-0.5 rounded">${item.daiName}</span>
                                <span class="text-xs text-slate-500">Cầu: ${item.viTri} (Biên độ: <b class="text-emerald-600">${item.bienDo} ngày</b>)</span>
                            </div>
                            <div class="grid grid-cols-3 gap-2 mt-2 text-center">
                                <div class="bg-white p-2 rounded-lg border border-slate-200">
                                    <span class="text-[10px] text-slate-400 block">BẠCH THỦ LÔ</span>
                                    <span class="text-base font-extrabold text-rose-600">${item.btl}</span>
                                </div>
                                <div class="bg-white p-2 rounded-lg border border-slate-200">
                                    <span class="text-[10px] text-slate-400 block">LÔ LỘN / CẶP</span>
                                    <span class="text-base font-extrabold text-indigo-600">${item.lot}</span>
                                </div>
                                <div class="bg-white p-2 rounded-lg border border-slate-200">
                                    <span class="text-[10px] text-slate-400 block">LÔ 3 CÀNG</span>
                                    <span class="text-base font-extrabold text-amber-600">${item.cang3}</span>
                                </div>
                            </div>
                        </div>
                    `;
                });

                // Gợi ý Xiên 2 kết hợp giữa các đài trong ngày
                if (allChotSoResults.length >= 2) {
                    let xien2_1 = `${allChotSoResults[0].btl} - ${allChotSoResults[1].btl}`;
                    let xien2_2 = allChotSoResults.length >= 3 ? `${allChotSoResults[1].btl} - ${allChotSoResults[2].btl}` : `${allChotSoResults[0].btl} - ${allChotSoResults[0].lot}`;
                    
                    html += `
                        <div class="mt-4 bg-amber-50 border border-amber-200 p-3.5 rounded-xl">
                            <h2 class="font-bold text-amber-800 text-sm mb-2">🔥 Gợi Ý Lọc Cặp Xiên 2 Trong Ngày:</h2>
                            <div class="flex gap-2">
                                <div class="flex-1 bg-white p-2.5 rounded-lg border border-amber-200 text-center">
                                    <span class="text-[10px] text-slate-500 block">XIÊN 2 (${allChotSoResults[0].daiName} & ${allChotSoResults[1].daiName})</span>
                                    <span class="text-sm font-bold text-rose-600">${xien2_1}</span>
                                </div>
                                <div class="flex-1 bg-white p-2.5 rounded-lg border border-amber-200 text-center">
                                    <span class="text-[10px] text-slate-500 block">XIÊN 2 (CẶP 2)</span>
                                    <span class="text-sm font-bold text-rose-600">${xien2_2}</span>
                                </div>
                            </div>
                        </div>
                    `;
                }

                container.innerHTML = html;
            }, 300);
        }
    </script>
</body>
</html>
